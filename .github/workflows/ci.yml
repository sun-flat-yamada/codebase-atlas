name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (tools/atlas_graph.py, scripts/automerge.py)
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff, bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          python -m pip install --quiet ruff
          ruff check tools scripts tests
          ruff format --check tools scripts tests
      - name: Shell syntax
        run: |
          for f in init.sh apply-host.sh next-id.sh selftest.sh templates/gates.sh hosts/*.sh hosts/*/*.sh playbooks/*/gate-snippets.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
          done

  selftest:
    name: Framework selftest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure git identity (init.sh commits into generated repositories)
        run: |
          git config --global user.name "codebase-atlas-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: selftest.sh
        run: |
          set -o pipefail
          bash selftest.sh 2>&1 | tee selftest.log
          grep -q '^結果: PASS [0-9]* / FAIL 0$' selftest.log

  graphify-integration:
    name: graphify end-to-end (init -> build -> G-GRAPHIFY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install graphify (fork)
        run: python -m pip install --quiet "git+https://github.com/sun-flat-yamada/graphify"
      - name: Configure git identity
        run: |
          git config --global user.name "codebase-atlas-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run the pipeline on the sample source
        run: bash scripts/ci-graphify-e2e.sh
